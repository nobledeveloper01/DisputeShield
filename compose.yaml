# Two Redis instances from the first commit, on purpose (§11.1): the broker holds
# the SLA sweep's task queue, and flushing a shared cache would destroy it.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: disputeshield_owner
      POSTGRES_PASSWORD: disputeshield
      POSTGRES_DB: disputeshield
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disputeshield_owner"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The isolation suite runs through this, not against postgres directly.
  # Transaction pooling is the only mode in which ADR-0005's bug is reproducible.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: disputeshield
      DB_PASSWORD: disputeshield
      DB_NAME: disputeshield
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
    ports: ["6432:5432"]
    depends_on:
      postgres:
        condition: service_healthy

  redis-broker:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - brokerdata:/data

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6380:6379"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
  brokerdata:
