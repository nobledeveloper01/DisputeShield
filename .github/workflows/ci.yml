name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DISPUTESHIELD_SECRET_KEY: ci-only-not-a-real-secret
  DISPUTESHIELD_DATABASE_URL: postgres://disputeshield:disputeshield@localhost:6432/disputeshield
  DISPUTESHIELD_DATABASE_DIRECT_URL: postgres://disputeshield_owner:disputeshield@localhost:5432/disputeshield
  DISPUTESHIELD_REDIS_BROKER_URL: redis://localhost:6379/0
  DISPUTESHIELD_REDIS_CACHE_URL: redis://localhost:6380/0

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,server]"
      - run: ruff check . && ruff format --check .

      # ADR-0005: the isolation suite must run through PgBouncer in transaction
      # pooling mode. Against Postgres directly the connection-reuse leak cannot
      # be reproduced, which is exactly why it survives review elsewhere.
      - run: docker compose up -d postgres pgbouncer redis-broker redis-cache
      - run: python manage.py migrate --no-input

      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov=disputeshield --cov-fail-under=85

  gates:
    # The blocking gates, run separately so a failure here is unmissable in the
    # checks list rather than buried in a general test run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,server]"
      - run: docker compose up -d postgres pgbouncer redis-broker redis-cache
      - run: python manage.py migrate --no-input

      - name: tenant and customer isolation (§8.1) — 404 not 403
        run: pytest -m isolation -q

      - name: audit immutability (§8.3) — enforced in Postgres, not the ORM
        run: pytest -m immutability -q

      - name: serializer field graph (§10) — internal notes cannot reach a customer
        run: pytest -m leakage -q

      - name: deadline correctness (§4.4) — DST, holidays, pauses
        run: pytest tests/test_sla_deadlines.py -q

      - name: deadline correctness under a hostile local timezone
        run: TZ=Pacific/Kiritimati pytest tests/test_sla_deadlines.py -q

      - name: the doctor fails when the immutability trigger is absent
        run: pytest tests/test_doctor_detects_missing_trigger.py -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: bandit -r disputeshield/ -q
      - run: semgrep --config auto --error
      - run: pip-audit
      - uses: gitleaks/gitleaks-action@v2
      - run: scripts/no-dangerous-html.sh
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix widget && npm run build --prefix widget
      - run: npm ci --prefix dashboard && npm run build --prefix dashboard

      - name: loader stays under 4KB gzipped (ADR-0001)
        run: scripts/check-loader-size.sh

      - name: playwright — widget isolation in both directions
        run: npx playwright test --prefix widget

      - name: axe-core accessibility gate (§9)
        run: npm run test:a11y --prefix widget

      - name: keyboard-only walkthrough of the filing flow
        run: npm run test:keyboard --prefix widget

      - name: CSP violations fail the build (§10.1)
        run: npm run test:csp --prefix widget

  build:
    needs: [quality, gates, security, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker buildx build -t disputeshield:ci .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: disputeshield:ci
          exit-code: "1"
          severity: HIGH,CRITICAL
