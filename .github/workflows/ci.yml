# The gates grow one phase at a time (docs/ROADMAP.md), and each one is added in
# the phase that makes it real. A job that asserts something the code cannot yet
# do is a red build that teaches people to ignore red builds; a job that passes
# vacuously is worse, because it looks like coverage. So the frontend and image
# jobs below are gated on the artefacts existing, and light up in phases 4 and 6.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DISPUTESHIELD_DEBUG: "1"
  DISPUTESHIELD_SECRET_KEY: ci-only-not-a-real-secret
  DISPUTESHIELD_ALLOWED_HOSTS: localhost,127.0.0.1
  DISPUTESHIELD_DATABASE_URL: postgres://disputeshield:disputeshield@localhost:5432/disputeshield
  DISPUTESHIELD_DATABASE_REPLICA_URL: postgres://disputeshield:disputeshield@localhost:5432/disputeshield
  DISPUTESHIELD_REDIS_BROKER_URL: redis://localhost:6379/0
  DISPUTESHIELD_REDIS_CACHE_URL: redis://localhost:6380/0
  DISPUTESHIELD_ENCRYPTION_KEY_REF: local://ci-master-key

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: disputeshield_owner
          POSTGRES_PASSWORD: disputeshield
          POSTGRES_DB: disputeshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disputeshield_owner"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis-broker:
        image: redis:7-alpine
        ports: ["6379:6379"]
      redis-cache:
        image: redis:7-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,server]"

      - run: ruff check .
      - run: ruff format --check .
      - run: scripts/no-dangerous-html.sh

      # The application connects as a restricted role that cannot UPDATE or
      # DELETE the audit table. Creating it here rather than relying on the
      # image's init hook keeps CI honest about which role runs the suite.
      - name: Create the restricted application role
        run: psql "$DISPUTESHIELD_DATABASE_DIRECT_URL" -f scripts/init-app-role.sql
        env:
          DISPUTESHIELD_DATABASE_DIRECT_URL: postgres://disputeshield_owner:disputeshield@localhost:5432/disputeshield
          PGPASSWORD: disputeshield

      - run: python manage.py migrate --no-input
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py disputeshield_doctor --strict
      - run: pytest --cov=disputeshield --cov-fail-under=85

  gates:
    # The blocking gates, run separately so a failure is unmissable in the checks
    # list rather than buried in a general test run. These never go yellow.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: disputeshield_owner
          POSTGRES_PASSWORD: disputeshield
          POSTGRES_DB: disputeshield
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disputeshield_owner"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis-broker:
        image: redis:7-alpine
        ports: ["6379:6379"]
      redis-cache:
        image: redis:7-alpine
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,server]"
      - name: Create the restricted application role
        run: psql "postgres://disputeshield_owner:disputeshield@localhost:5432/disputeshield" -f scripts/init-app-role.sql
        env:
          PGPASSWORD: disputeshield
      - run: python manage.py migrate --no-input

      - name: tenant isolation (§8.1) — three layers, asserted independently
        run: pytest -m isolation -q

      - name: audit immutability (§8.3) — enforced in Postgres, not the ORM
        run: pytest -m immutability -q

      - name: the chain detects tampering, and the break propagates
        run: pytest tests/test_audit_chain.py -q

      - name: concurrent appends do not fork the chain (ADR-0003)
        run: pytest tests/test_audit_concurrency.py -q

      - name: the doctor fails when the immutability trigger is absent
        run: pytest tests/test_doctor_detects_missing_trigger.py -q

      - name: deadline correctness (§4.4) — DST both ways, holidays, pauses
        run: pytest tests/test_sla_deadlines.py -q
        env:
          HYPOTHESIS_EXAMPLES: "10000"

      - name: deadline correctness under a hostile local timezone
        # A deadline that depends on where the server runs is a deadline that
        # changes when the deployment moves regions.
        run: TZ=Pacific/Kiritimati pytest tests/test_sla_deadlines.py -q

      - name: the clock cannot be paused without a reason (§4.4 C3)
        run: pytest tests/test_sla_clock.py -q

      - name: the sweep is idempotent and catch-up replays exactly what was missed
        run: pytest tests/test_sla_sweep.py -q

      - name: serializer field graph (§10) — no path from a customer to internal content
        run: pytest -m leakage -q

      - name: every state transition writes actor, reason and clock state (§3.4)
        run: pytest tests/test_dispute_transitions.py -q

      - name: the queue stays under 300ms p95 at 10,000 open cases (§11.9)
        run: pytest tests/test_queue_performance.py -q

      # Added in the phase that makes each one real:
      #   phase 4 — widget isolation in both directions
      #   phase 9 — no call path from any module to a payment write

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: bandit -r disputeshield/ -q
      - run: pip-audit --skip-editable
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/python
        continue-on-error: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  frontend:
    # Lights up in phase 4, when there is a widget to isolate and a loader to
    # weigh. Skipping until then beats a red build nobody can act on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: |
          if [ -f widget/package.json ]; then echo "built=true" >> "$GITHUB_OUTPUT"; else
            echo "widget/ is not built yet — phase 4 (docs/ROADMAP.md)"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.built == 'true'
        with:
          node-version: "22"
      - if: steps.exists.outputs.built == 'true'
        run: npm ci --prefix widget && npm run build --prefix widget
      - name: loader stays under 4KB gzipped (ADR-0001)
        if: steps.exists.outputs.built == 'true'
        run: scripts/check-loader-size.sh
      - name: playwright — widget isolation in both directions
        if: steps.exists.outputs.built == 'true'
        run: npx playwright test --prefix widget
      - name: axe-core plus a keyboard-only filing walkthrough (§9)
        if: steps.exists.outputs.built == 'true'
        run: npm run test:a11y --prefix widget && npm run test:keyboard --prefix widget

  build:
    needs: [quality, gates, security, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker buildx build -t disputeshield:ci .

      # Blocking: HIGH and CRITICAL that have a fix available. `ignore-unfixed`
      # is not a softening — a gate that fails on vulnerabilities with no patch
      # anywhere is a gate that can never go green, and the only thing it
      # reliably produces is a team that has learned to bypass it.
      - name: Vulnerabilities with an available fix fail the build
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: disputeshield:ci
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Non-blocking, and published: unfixed vulnerabilities are still our
      # customer's exposure, so they are reported rather than quietly excluded.
      # §8.5 promises a customer's security team can assess DisputeShield without
      # asking, and that promise covers the ones we cannot fix yet.
      - name: Full report, including vulnerabilities with no fix available
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: disputeshield:ci
          exit-code: "0"
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-unfixed.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-unfixed.sarif
