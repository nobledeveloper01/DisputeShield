# Publishes site/ to GitHub Pages.
#
# The page is plain static HTML with no build step and no external requests, so
# there is nothing to install and nothing that can break between authoring it
# and serving it. Runs only when site/ actually changes, because a docs deploy
# on every unrelated push makes the deploy history useless for answering "when
# did the site last change".
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a stale
# one, and these run in seconds anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the page is self-contained
        # A landing page that reaches out to a CDN is a page that breaks when
        # the CDN does, and leaks a visitor's IP to a third party. Neither is
        # acceptable for a static pitch, so it is enforced rather than trusted.
        #
        # Code samples are stripped before the check. An escaped `&lt;script
        # src="…"&gt;` inside <pre> is text the browser renders, not an asset it
        # fetches, and failing the build on it teaches people to delete the
        # example rather than to inline the asset.
        run: |
          python3 - <<'EOF'
          import re, sys

          html = open("site/index.html", encoding="utf-8").read()
          html = re.sub(r"<pre\b.*?</pre>", "", html, flags=re.S | re.I)
          html = re.sub(r"<code\b.*?</code>", "", html, flags=re.S | re.I)

          allowed = re.compile(r"^https://(github\.com|[a-z0-9-]+\.github\.io)/")
          remote = [
              url
              for _, url in re.findall(r'(src|href)="(https?://[^"]+)"', html)
              if not allowed.match(url)
          ]
          if remote:
              for url in remote:
                  print(f"::error::site/index.html loads a remote asset: {url}")
              sys.exit(1)
          print("no remote assets")
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
