[project]
name = "disputeshield"
version = "0.1.0"
description = "Embeddable dispute and SLA management for fintechs"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "NobleConcepts" }]
keywords = ["disputes", "complaints", "sla", "compliance", "fintech", "audit"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "orjson>=3.10",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "freezegun>=1.5",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "playwright>=1.47",
]
server = [
    "gunicorn>=23.0",
    "gevent>=24.2",
    "django-environ>=0.11",
    "whitenoise>=6.7",
]

[project.urls]
Homepage = "https://github.com/nobledeveloper01/DisputeShield"
Documentation = "https://github.com/nobledeveloper01/DisputeShield/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["disputeshield"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff formats Python code blocks inside Markdown. The specification, the ADRs
# and the README are source documents whose examples are written for a reader,
# not for a linter — `make fmt` must not silently rewrite them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DJ", "C4", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# RUF012 wants ClassVar on mutable class attributes. Django's Meta options,
# `constraints`, `indexes` and a Migration's `operations` are all mutable class
# attributes by framework design, and annotating them fights the framework
# without making anything safer.
"*/migrations/*" = ["RUF012"]
"disputeshield/models/*" = ["RUF012"]
# DRF views declare `permission_classes` and friends as plain lists by convention.
"disputeshield/api/*" = ["RUF012"]
# A semgrep suppression pragma has to live on the offending line, so that one
# line is allowed to run long.
"disputeshield/api/views_embed.py" = ["RUF012", "E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "server.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "isolation: tenant and customer isolation gates (blocking, §8.1)",
    "immutability: audit immutability gates (blocking, §8.3)",
    "leakage: serializer field-graph gates (blocking, §10)",
    "slow: excluded from the fast local loop",
]

[tool.coverage.run]
source = ["disputeshield"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
